# Baut bei einem Versions-Tag (v*) das Produktionsbild und legt es in die GitHub Container Registry:
#   ghcr.io/the-monte-christo/drum-pattern-helper:<tag> und :latest
# Auf dem Server holt `deploy.sh` es von dort (siehe deploy/server/).
#
# Neue Version veröffentlichen:  git tag v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  bild:
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: namen
        name: Bildnamen bestimmen
        run: echo "bild=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Tag-Build: v1.2.3 + latest. Manueller Start ohne Tag: Branch-Name + sha-xxxxxxx (kein latest).
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.namen.outputs.bild }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
