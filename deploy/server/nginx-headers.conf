# /etc/nginx/snippets/drumpatternhelper-headers.conf
#
# Muss in JEDEN location-Block der Seite eingebunden werden: Sobald ein
# location-Block ein eigenes add_header setzt, verwirft nginx sämtliche
# geerbten Header aus dem server-Block.

# Die App lädt nur eigene Ressourcen – keine CDNs, keine Fonts von außen, kein Inline-Skript.
# Styles setzt sie per CSSOM (element.style), das braucht kein 'unsafe-inline'.
# worker-src: Audio-Taktgeber (Web Worker) und Service Worker kommen vom eigenen Ursprung.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

# Ein Jahr, ohne preload: Bei einem Zertifikatsproblem bleibt die Seite
# reparierbar, statt in Browsern dauerhaft blockiert zu sein.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Wake Lock (Bildschirm bleibt beim Üben an) bleibt erlaubt – es steht absichtlich nicht in der Liste.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
