# /etc/nginx/sites-available/drumpatternhelper.blanke.nrw
#
# Aufbau wie republic-of-rome.blanke.nrw: eigenes Zertifikat, HTTP leitet auf
# HTTPS um. Hinter der Adresse liegt der Node-Server aus dem Docker-Stapel
# (127.0.0.1:3030). Er liefert das gebaute Frontend selbst aus und setzt auch
# die Cache-Header (gehashte Assets immutable, index.html und sw.js no-cache).

server {
    server_name drumpatternhelper.blanke.nrw;

    location / {
        include snippets/drumpatternhelper-headers.conf;
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Pattern sind wenige KB; die App selbst begrenzt auf 256 KB.
    client_max_body_size 256k;

    # Ersetzend gedacht: svg und Manifest kommen gegenüber der globalen Liste
    # aus nginx.conf dazu. Der Server selbst komprimiert nicht.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    location ~ /\. {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/drumpatternhelper.blanke.nrw/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/drumpatternhelper.blanke.nrw/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name drumpatternhelper.blanke.nrw;

    # Muss über HTTP erreichbar bleiben, sonst scheitert die automatische
    # Zertifikatserneuerung. Steht vor der Umleitung, ^~ schlägt sie.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
