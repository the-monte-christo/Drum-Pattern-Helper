# Beispiel-Konfiguration für nginx als Reverse Proxy vor dem Container.
# Domain und Zertifikatspfade anpassen (z. B. via certbot).

server {
    listen 80;
    listen [::]:80;
    server_name drums.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name drums.example.com;

    ssl_certificate     /etc/letsencrypt/live/drums.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drums.example.com/privkey.pem;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
